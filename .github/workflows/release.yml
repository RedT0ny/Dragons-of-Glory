name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.trigger.outputs.run_id }}
    steps:
      - name: Trigger build-windows-exe
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api \
            -X POST \
            "repos/${{ github.repository }}/actions/workflows/build-windows-exe.yml/dispatches" \
            -f ref="${{ github.ref_name }}"

          sleep 10

          RUN_ID=$(gh run list \
            --workflow build-windows-exe.yml \
            --branch "${{ github.ref_name }}" \
            --limit 20 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')

          if [ -z "${RUN_ID:-}" ]; then
            echo "::error::No workflow run was created for Build Windows EXE on ${{ github.ref_name }}"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --interval 30

  release:
    name: Create GitHub release
    needs: build-windows
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute release metadata
        id: meta
        run: |
          python - <<'PY' > /dev/null
          import os
          import pathlib
          import re
          import sys

          text = pathlib.Path("src/content/config.py").read_text(encoding="utf-8")
          match = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not match:
              sys.exit("APP_VERSION not found in src/content/config.py")

          version = match.group(1)
          base, dash, suffix = version.partition("-")
          if dash and suffix:
              label = suffix.replace("-", " ").strip().capitalize()
              title = f"Dragons of Glory {base} {label}"
              prerelease = "true"
          else:
              title = f"Dragons of Glory {version}"
              prerelease = "false"

          pathlib.Path("title.txt").write_text(title + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag=v{version}\n")
              fh.write(f"title={title}\n")
              fh.write(f"prerelease={prerelease}\n")
          PY

      - name: Build release notes
        id: notes
        env:
          TITLE: ${{ steps.meta.outputs.title }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"

          {
            printf '%s\n\n' "$TITLE"
            git -C "$REPO_ROOT" log -1 --pretty=%B
            printf '\n'
          } > release_notes.md

          PREV_TAG=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r --arg cur "$TAG" '[.[] | select(.tagName != $cur)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git -C "$REPO_ROOT" tag --list --sort=-v:refname | grep -v -x "$TAG" | head -n 1 || true)
          fi
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$PREV_TAG" "$TAG" >> release_notes.md
          fi
          cat release_notes.md

      - name: Download latest Windows EXE
        id: artifact
        env:
          RUN_ID: ${{ needs.build-windows.outputs.run_id }}
          EXPECTED: dog_${{ steps.meta.outputs.version }}.exe
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          if [ -z "${RUN_ID:-}" ]; then
            echo "::error::Build run id was not recorded. The Windows EXE build did not finish successfully."
            exit 1
          fi

          gh run download "$RUN_ID" --name dog-windows-exe --dir dist >/dev/null

          if [ -f "dist/dog-windows-exe.zip" ]; then
            echo "Extracting dog-windows-exe.zip"
            unzip -o "dist/dog-windows-exe.zip" -d dist >/dev/null
            rm -f "dist/dog-windows-exe.zip"
          fi

          found_exe=$(find dist -type f -name '*.exe' | head -n 1 || true)
          if [ -z "$found_exe" ]; then
            echo "::error::Artifact dog-windows-exe from run $RUN_ID does not contain any .exe file."
            exit 1
          fi

          if [ "$(basename "$found_exe")" != "$EXPECTED" ]; then
            echo "Renaming $found_exe to dist/$EXPECTED"
            mv "$found_exe" "dist/$EXPECTED"
          fi

          find dist -type f ! -name "$EXPECTED" -delete
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create or update release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          EXE: dist/${{ steps.meta.outputs.version }}.exe
        run: |
          set -euo pipefail
          TARGET=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          FLAGS=(--title "$TITLE" --notes-file release_notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--prerelease=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating it"
            gh release edit "$TAG" "${FLAGS[@]}"
            gh release upload "$TAG" "$EXE" --clobber
          else
            gh release create "$TAG" "$EXE" "${FLAGS[@]}" --target "$TARGET"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          PREV_TAG: ${{ steps.notes.outputs.previous_tag }}
          EXE: dist/${{ steps.meta.outputs.version }}.exe
        run: |
          {
            echo "### Release $TAG"
            echo ""
            echo "- Title: $TITLE"
            echo "- Prerelease: $PRERELEASE"
            echo "- Asset: \`$EXE\`"
            echo "- Previous tag: ${PREV_TAG:-none}"
            echo "- Full changelog: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$TAG}...$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
