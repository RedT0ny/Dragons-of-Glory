name: Attach Windows exe to published release

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  attach-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Find latest successful build-windows-exe workflow run
        id: find_run
        env:
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: build-windows-exe.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Repository: $REPO"
          API="https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?status=success&per_page=1"
          echo "Querying: $API"
          runs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API")
          run_id=$(echo "$runs_json" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful workflow run found for $WORKFLOW_FILE"
            exit 1
          fi
          echo "Found workflow run: $run_id"
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

      - name: Download and extract artifact, find .exe
        id: download_artifact
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=${{ steps.find_run.outputs.run_id }}
          echo "Using run id: $run_id"
          artifacts_api="https://api.github.com/repos/$REPO/actions/runs/$run_id/artifacts"
          artifacts_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$artifacts_api")

          # prefer artifact with name containing win/exe/windows, otherwise pick first
          art_id=$(echo "$artifacts_json" | jq -r '.artifacts[] | select(.name|test("win|exe|windows","i")) | .id' | head -n1)
          if [ -z "$art_id" ]; then
            art_id=$(echo "$artifacts_json" | jq -r '.artifacts[0].id // empty')
          fi
          if [ -z "$art_id" ]; then
            echo "No artifacts found for run $run_id"
            exit 1
          fi
          echo "Artifact id: $art_id"

          download_url="https://api.github.com/repos/$REPO/actions/artifacts/$art_id/zip"
          echo "Downloading artifact..."
          curl -s -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$download_url" -o artifact.zip

          mkdir -p artifact && unzip -q -o artifact.zip -d artifact
          exe_path=$(find artifact -type f -iname '*.exe' | head -n1 || true)
          if [ -z "$exe_path" ]; then
            echo "No .exe file found inside the artifact"
            ls -R artifact || true
            exit 1
          fi
          echo "Found exe: $exe_path"
          echo "exe_path=$exe_path" >> $GITHUB_OUTPUT

      - name: Upload exe to the published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe_path=${{ steps.download_artifact.outputs.exe_path }}
          echo "Uploading $exe_path to release"
          upload_url=$(jq -r .release.upload_url < "$GITHUB_EVENT_PATH")
          release_id=$(jq -r .release.id < "$GITHUB_EVENT_PATH")
          # strip the templated part
          upload_url=${upload_url%\{*}
          name=$(basename "$exe_path")
          echo "Upload URL: $upload_url"
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$exe_path" "$upload_url?name=$name" | jq -r '.url'

      - name: Generate brief release notes and update release body
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id=$(jq -r .release.id < "$GITHUB_EVENT_PATH")
          current_tag=$(jq -r .release.tag_name < "$GITHUB_EVENT_PATH")

          # find previous release's tag
          releases_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases?per_page=5")
          prev_tag=$(echo "$releases_json" | jq -r --arg CUR "$current_tag" '.[] | select(.tag_name != $CUR) | .tag_name' | head -n1 || true)

          if [ -n "$prev_tag" ]; then
            echo "Comparing $prev_tag...$current_tag"
            compare_api="https://api.github.com/repos/$REPO/compare/$prev_tag...$current_tag"
            compare_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$compare_api")
            changes=$(echo "$compare_json" | jq -r '.commits[] | "- " + (.commit.message | split("\n")[0])' | sed '/^-/!d' || true)
          else
            echo "No previous tag found; not generating commit list"
            changes="(no previous tag found)"
          fi

          if [ -z "$changes" ]; then
            changes="(no commit messages available)"
          fi

          body="Automated attachment: the latest Windows executable built by the CI has been attached to this release.\n\nChanges since ${prev_tag:-<none>} -> $current_tag:\n$changes"

          # update release body
          payload=$(jq -n --arg b "$body" '{body: $b}')
          echo "Updating release $release_id"
          curl -s -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -d "$payload" "https://api.github.com/repos/$REPO/releases/$release_id"